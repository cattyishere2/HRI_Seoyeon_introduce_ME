<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>누나를 찾아서</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #fde4ef;
      font-family: "Courier New", monospace;
      color: #6b3a55;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
    }
    h1 { font-size: 28px; margin: 0; letter-spacing: 2px; }
    p { margin: 0; font-size: 15px; }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <h1>누나를 찾아서</h1>
  <p>Coming soon<span class="blink">_</span></p>
  <p style="font-size:12px; opacity:.6;">GitHub Pages 연결 확인용 임시 페이지</p>
</body>
</html>
